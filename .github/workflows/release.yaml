name: release

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - checks
    types:
      - completed
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    outputs:
      published: ${{ steps.changesets.outputs.published }}
      extension_published: ${{ steps.extension.outputs.published }}
      extension_version: ${{ steps.extension.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          title: "*: version packages"
          commit: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Detect extension release
        id: extension
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          version=$(jq -r 'map(select(.name == "snowcss-intellisense")) | .[0].version // ""' \
            <<< "$PUBLISHED_PACKAGES")

          if [ -n "$version" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  vscode:
    name: Release Visual Studio Code Extension Artifact
    needs: release
    if: needs.release.outputs.extension_published == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload extension
        run: |
          tag="snowcss-intellisense@${{ needs.release.outputs.extension_version }}"

          pnpm vscode:build
          pnpm vscode:package

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" editors/vscode/*.vsix --clobber
          else
            gh release create "$tag" editors/vscode/*.vsix --title "$tag"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
